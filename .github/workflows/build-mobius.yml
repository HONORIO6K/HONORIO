name: Build Mobius CT0 Interlude Java 25

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          java -version
          ant -version

      - name: Fetch official Mobius CT0 Interlude
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --no-checkout https://gitlab.com/MobiusDevelopment/L2J_Mobius.git upstream
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set L2J_Mobius_CT_0_Interlude
          git -C upstream checkout
          git -C upstream rev-parse HEAD | tee official_commit.txt

      - name: Verify Java 25 target
        shell: bash
        run: |
          set -euxo pipefail
          grep -n 'source="25"' upstream/L2J_Mobius_CT_0_Interlude/build.xml
          grep -n 'target="25"' upstream/L2J_Mobius_CT_0_Interlude/build.xml

      - name: Build official distribution
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream/L2J_Mobius_CT_0_Interlude
          ant
          test -f ../build/L2J_Mobius_CT_0_Interlude.zip
          unzip -tq ../build/L2J_Mobius_CT_0_Interlude.zip
          sha256sum ../build/L2J_Mobius_CT_0_Interlude.zip | tee ../../mobius_sha256.txt

      - name: Upload compiled server
        uses: actions/upload-artifact@v4
        with:
          name: l2j-mobius-ct0-interlude-java25
          path: |
            upstream/build/L2J_Mobius_CT_0_Interlude.zip
            official_commit.txt
            mobius_sha256.txt
          if-no-files-found: error
          retention-days: 1
